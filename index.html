<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A free, self-guided guide to adding quantitative analysis to qualitative research in the humanities and social sciences, with tools, videos and a section on coding with open language models.">
<title>Mixed-Methods Research Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@200;400;700;900&family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&family=Oswald:wght@400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f6f8;--panel:#ffffff;--panel2:#e8eef2;--fg:#15202b;--muted:#506070;--line:#d3dde5;
  --accent:#0d5c78;--accent-fg:#ffffff;--accent-soft:#d9eaf1;--mark:#ffe08a;--ok:#13795b;--warn:#a6461b;
  --c0:#e06038;--c1:#14868c;--c2:#e2a12f;--c3:#5b62c9;--c4:#7f9a23;--c5:#c2557e;--c6:#2f7fb5;
  --f-serif:'EB Garamond',Garamond,'Times New Roman',serif;
  --f-sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-ar:'Noto Naskh Arabic','Geeza Pro',Arial,serif;
  --top:54px;--bar:58px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181c;--panel:#1c2126;--panel2:#252b31;--fg:#ebe8e2;--muted:#a6a39b;--line:#343b43;
  --accent:#6fc0d8;--accent-fg:#0f1418;--accent-soft:#1f3a45;--mark:#5d4f1d;--ok:#7fc4a8;--warn:#ef9a73;
  --c0:#ef8a62;--c1:#5fb3a6;--c2:#e8c15a;--c3:#9aa6e6;--c4:#a5c46a;--c5:#e08bb0;--c6:#79a9d6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181c;--panel:#1c2126;--panel2:#252b31;--fg:#ebe8e2;--muted:#a6a39b;--line:#343b43;
  --accent:#6fc0d8;--accent-fg:#0f1418;--accent-soft:#1f3a45;--mark:#5d4f1d;--ok:#7fc4a8;--warn:#ef9a73;
  --c0:#ef8a62;--c1:#5fb3a6;--c2:#e8c15a;--c3:#9aa6e6;--c4:#a5c46a;--c5:#e08bb0;--c6:#79a9d6;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:clamp(15px,0.35vw + 12px,18px);scroll-padding-top:7rem}
body{background:var(--bg);color:var(--fg);font:400 1rem/1.55 var(--f-sans);margin:0}
h1,h2,h3,h4{font-family:var(--f-serif);margin:0;line-height:1.15;text-wrap:balance;font-weight:600}
h1{font-size:2.9rem;letter-spacing:-.01em}
h2{font-size:1.9rem}
h3{font-size:1.25rem;margin-bottom:.35rem}
h4{font-size:1.05rem;margin-bottom:.25rem}
p{margin:0 0 .6rem;max-width:68ch}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
.kick{font:500 .72rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:.35rem}
.note{font-size:.84rem;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.ar{font-family:var(--f-ar);direction:rtl}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* cards & grids */
.grid{display:grid;gap:.9rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:860px){.g3,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3,.g4,.g5{grid-template-columns:minmax(0,1fr)}h1{font-size:2.1rem}h2{font-size:1.5rem}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;min-width:0}
.card.soft{background:var(--panel2)}
.card.acc{border-left:5px solid var(--accent)}
.card p:last-child{margin-bottom:0}
.pill{display:inline-block;font:500 .7rem var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:.12rem .45rem;border-radius:99px;background:var(--accent-soft);color:var(--fg)}
.pill.q{background:color-mix(in srgb,var(--c3) 22%,transparent)}
.pill.n{background:color-mix(in srgb,var(--c0) 22%,transparent)}
ul.clean{margin:0;padding-left:1.1rem}ul.clean li{margin:.2rem 0}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th,table.t td{text-align:left;vertical-align:top;padding:.4rem .5rem;border-bottom:1px solid var(--line)}
table.t th{font-weight:600;background:var(--panel2)}
.tw{overflow-x:auto;max-width:100%}

/* loop */
.loop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem;counter-reset:lp}
.loop button{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem;display:flex;flex-direction:column;gap:.3rem;position:relative}
.loop button:hover,.loop button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.loop .n{font:600 2rem var(--f-serif);color:var(--accent)}
.loop .t{font-weight:600}
.loop .k{font:500 .68rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.loop button.qn{background:var(--fg);color:var(--bg)}.loop button.qn .n,.loop button.qn .k{color:var(--mark)}
@media (max-width:760px){.loop{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* step slide */
.stephead{display:flex;gap:1rem;align-items:flex-start}
.stepnum{font:600 3.2rem/1 var(--f-serif);color:var(--accent);min-width:2.4ch}
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:.45rem .8rem;border-radius:8px 8px 0 0;font-size:.9rem;color:var(--muted);border:1px solid transparent;border-bottom:0;margin-bottom:-1px}
.tabs button.on{background:var(--panel);color:var(--fg);border-color:var(--line);font-weight:600}
.tabs button:focus-visible{outline:3px solid var(--accent)}
.tabs .ic{font-family:var(--f-mono);font-size:.7rem;margin-right:.3rem;color:var(--accent)}
.pane{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:1.1rem 1.2rem}
.pane.hide{display:none}
.claimtab td:first-child{font-weight:600;white-space:nowrap}

/* forms */
label.f{display:flex;flex-direction:column;gap:.2rem;font-size:.84rem;color:var(--muted)}
input.i,select.i,textarea.i{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.4rem .55rem;color:var(--fg);font-size:.92rem;width:100%}
textarea.i{min-height:5.5rem;font-family:var(--f-mono);font-size:.8rem;line-height:1.4}
.out{background:var(--panel2);border-radius:10px;padding:.8rem 1rem;font-size:.95rem}
.out.big{font:500 1.2rem/1.45 var(--f-serif)}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:.35rem;flex-wrap:wrap}
.chips button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:99px;padding:.22rem .7rem;font-size:.84rem;background:var(--panel)}
.chips button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.stat{display:flex;flex-direction:column;background:var(--panel2);border-radius:10px;padding:.6rem .8rem;min-width:0}
.stat b{font:600 1.6rem var(--f-serif)}
.stat span{font-size:.78rem;color:var(--muted)}
.good{color:var(--ok)}.bad{color:var(--warn)}
.flag{border-left:4px solid var(--warn);padding:.4rem .7rem;background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:0 8px 8px 0;font-size:.88rem}
.okbox{border-left:4px solid var(--ok);padding:.4rem .7rem;background:color-mix(in srgb,var(--ok) 10%,transparent);border-radius:0 8px 8px 0;font-size:.88rem}
.cb{width:100%;border-collapse:collapse;font-size:.82rem}
.cb td,.cb th{border:1px solid var(--line);padding:.25rem;vertical-align:top}
.cb th{background:var(--panel2);font-weight:600;text-align:left}
.cb textarea,.cb input{width:100%;border:0;background:transparent;font:inherit;color:inherit;resize:vertical;min-height:2.2rem}
.bar{display:grid;grid-template-columns:8rem minmax(0,1fr) 3.6rem;gap:.5rem;align-items:center;font-size:.82rem}
.bar i{display:block;height:.75rem;border-radius:3px;background:var(--accent)}
.bar .tr{background:var(--panel2);border-radius:3px}

/* video cards */
.vid{display:flex;gap:.8rem;align-items:flex-start;text-decoration:none;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem}
.vid:hover{border-color:var(--accent)}
.vid .pl{flex:0 0 2.4rem;height:2.4rem;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:.9rem}
.vid b{display:block;font-size:.92rem}
.vid span{font-size:.8rem;color:var(--muted)}
video{width:100%;max-width:100%;border-radius:10px;border:1px solid var(--line);background:#000}
details.tr{font-size:.85rem}details.tr summary{cursor:pointer;color:var(--accent)}
.ref{font-size:.86rem;margin:.35rem 0;padding-left:1.4rem;text-indent:-1.4rem}
.ref .why{display:block;text-indent:0;color:var(--muted);font-size:.8rem}
.quiz .q{margin-bottom:.8rem}
.quiz .opts{display:flex;flex-direction:column;gap:.3rem;margin-top:.3rem}
.quiz .opts button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:.35rem .6rem;font-size:.88rem;background:var(--bg)}
.quiz .opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.quiz .opts button.wrong{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.quiz .fb{font-size:.84rem;margin-top:.3rem;color:var(--muted)}
.qb-row{display:grid;grid-template-columns:minmax(0,1fr);gap:.4rem}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem}
.qcard .q{font:500 1.08rem/1.35 var(--f-serif)}
.qcard dl{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:.15rem .6rem;margin:.5rem 0 0;font-size:.84rem}
.qcard dt{color:var(--muted)}.qcard dd{margin:0}
@media (max-width:560px){.qcard dl{grid-template-columns:minmax(0,1fr)}}
.copyok{font-size:.8rem;color:var(--ok)}

/* anatomy kit */

.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

/* ===== v2 shell ===== */
:root{--s1:#c2552f;--s2:#b07d12;--s3:#2f7f86;--s4:#4f58b8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#ef8a62;--s2:#e3bb55;--s3:#63bdb0;--s4:#9aa6e6}}
:root[data-theme="dark"]{--s1:#ef8a62;--s2:#e3bb55;--s3:#63bdb0;--s4:#9aa6e6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
.bar2{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar2 .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:.8rem;padding-block:.5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand2{all:unset;cursor:pointer;font:600 1.1rem var(--f-serif);white-space:nowrap}
.brand2 span{color:var(--accent)}
.stepper{display:flex;align-items:center;gap:.25rem;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:.15rem}
.stepper::-webkit-scrollbar{display:none}
.stg{display:flex;align-items:center;gap:.2rem;padding:.12rem .3rem .12rem .5rem;border-radius:99px;background:color-mix(in srgb,var(--sc) 12%,transparent)}

.menu2 .dd{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.4rem;display:flex;flex-direction:column;min-width:13rem;box-shadow:0 10px 30px rgb(0 0 0 / .18)}

main{max-width:1180px;margin:0 auto;padding-block:1.4rem 3rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scr{display:flex;flex-direction:column;gap:1.1rem;animation:scrin .45s cubic-bezier(.16,1,.3,1)}

/* home */

@media (max-width:480px){.journey{grid-template-columns:minmax(0,1fr)}}
.jcol{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:.35rem;border-radius:12px;padding:.8rem .9rem;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--sc);min-width:0}

.jcol .st{font:500 .76rem var(--f-mono);color:var(--sc)}
.benchwrap{border-radius:14px;overflow:hidden;border:1px solid var(--line)}

.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:.8rem;flex-wrap:wrap}
.sechead h2{font-size:1.5rem}

/* step screen */
.shead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1rem;align-items:center}
.snum{font:600 4.2rem/1 var(--f-serif);color:var(--sc)}
.stag{font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--sc)}
.shead h2{font-size:clamp(1.6rem,3vw,2.2rem)}
.shead p{margin:.25rem 0 0;color:var(--muted);font-size:1.02rem}
.tabs2{display:flex;gap:.35rem;flex-wrap:wrap}

.tabs2 button svg{width:1rem;height:1rem;flex:none}
.tabs2 button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.pane2{min-width:0}
.why3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem}

.ev{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.55rem;min-width:0}

.chip{all:unset;cursor:pointer;align-self:flex-start;font:500 .76rem var(--f-mono);padding:.2rem .6rem;border-radius:99px;background:var(--accent-soft);color:var(--fg)}

.player{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:.9rem;align-items:start}
@media (max-width:860px){.player{grid-template-columns:minmax(0,1fr)}}
.plist{display:flex;flex-direction:column;gap:.4rem}
.plist button{all:unset;cursor:pointer;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.6rem;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem}
.plist button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.plist button:focus-visible{outline:3px solid var(--accent)}
.plist .pl2{width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:.75rem}
.plist b{display:block;font-size:.9rem}.plist small{display:block;color:var(--muted);font-size:.76rem}
.case{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem}
@media (max-width:860px){.case{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.case{grid-template-columns:minmax(0,1fr)}}
.case > div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.85rem .95rem;min-width:0}
.case .lb{font:500 .64rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--sc);margin-bottom:.3rem}
.case .num{font:600 1.35rem/1.25 var(--f-serif)}
.case p{font-size:.9rem;margin:0 0 .4rem}
.check{background:var(--panel2);border-radius:14px;padding:1rem 1.1rem;display:grid;gap:.5rem}
.check .q{font:500 1.08rem/1.35 var(--f-serif)}
.check .opts{display:flex;gap:.4rem;flex-wrap:wrap}

.pager{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap}

.pager .btn small{font:500 .66rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pager .nx{margin-left:auto;align-items:flex-end}

/* sims */
.sim{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;display:grid;gap:.7rem;margin-top:.9rem}
.sim h4{display:flex;align-items:center;gap:.5rem}
.sim h4 .pill{font-size:.62rem}
.sl2{display:grid;grid-template-columns:11rem minmax(0,1fr) 3.4rem;gap:.6rem;align-items:center;font-size:.86rem}
@media (max-width:560px){.sl2{grid-template-columns:minmax(0,1fr) 3.4rem}.sl2 input{grid-column:1/-1;grid-row:2}}
.sl2 input{width:100%;accent-color:var(--accent)}
.sl2 output{font:500 .9rem var(--f-mono);text-align:right}
.meter{display:grid;gap:.3rem}
.meter .tr{height:1.1rem;border-radius:6px;background:var(--panel2);position:relative;overflow:hidden}
.meter .tr i{position:absolute;inset:0 auto 0 0;border-radius:6px;transition:width .3s cubic-bezier(.65,0,.35,1)}
.meter .lb{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.meter .lb b{color:var(--fg);font-family:var(--f-mono)}
.strip{position:relative;height:3.2rem;background:var(--panel2);border-radius:8px}
.strip .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.strip .tru{position:absolute;top:-.2rem;bottom:-.2rem;width:2px;background:var(--fg)}
.strip .dot{position:absolute;top:50%;width:.7rem;height:.7rem;margin:-.35rem 0 0 -.35rem;border-radius:50%;opacity:.75;animation:pop .35s cubic-bezier(.16,1,.3,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.axis{display:flex;justify-content:space-between;font:500 .7rem var(--f-mono);color:var(--muted)}

/* toolkit */
.lib{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}

@media (max-width:520px){.lib{grid-template-columns:minmax(0,1fr)}}
.lib figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.6rem;min-width:0}

.find{width:100%;max-width:26rem}
.rl .ref{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem .6rem 2rem;margin:0 0 .5rem}
.lnk{display:inline-flex;align-items:center;gap:.3rem;text-decoration:none;font-size:.84rem;font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
a.btn{text-decoration:none;color:var(--fg);display:inline-block}
a.btn.pri{color:var(--accent-fg)}
.foot{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:.8rem;margin-top:1rem}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.4rem .85rem;cursor:pointer;font-size:.88rem;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.sm{padding:.25rem .6rem;font-size:.82rem}
.player.one{grid-template-columns:minmax(0,1fr)}.player.one .plist{display:none}
.ctl{font-size:.8rem;color:var(--muted);display:flex;gap:.3rem;align-items:center}

/* ===== v3: template look (navy, steel blue, red; condensed headings) ===== */
:root{--bg:#ffffff;--panel:#ffffff;--panel2:#f4f6f8;--fg:#10293a;--muted:#4f6878;--line:#d5e0e7;
 --accent:#0f4d6b;--accent-fg:#ffffff;--accent-soft:#e1edf3;--steel:#5092b3;--navy:#0f4d6b;--cta:#d40004;--cta-fg:#ffffff;--ok:#1d7a52;--warn:#b5400f;
 --s1:#5092b3;--s2:#0f4d6b;--s3:#c0392b;--s4:#2a7f74;
 --f-serif:'Oswald','Arial Narrow','Roboto Condensed',sans-serif;--f-sans:'Source Sans 3','Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0c1a23;--panel:#12242f;--panel2:#0f2029;--fg:#e7eef2;--muted:#a1b6c3;--line:#26414f;
 --accent:#8cc3de;--accent-fg:#0c1a23;--accent-soft:#183644;--steel:#79b3d1;--navy:#0b3a52;--cta:#ff4d43;--cta-fg:#16080a;--ok:#73cf9f;--warn:#f39a6c;
 --s1:#79b3d1;--s2:#9cc7ea;--s3:#ff7a6b;--s4:#6cc4b6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1a23;--panel:#12242f;--panel2:#0f2029;--fg:#e7eef2;--muted:#a1b6c3;--line:#26414f;
 --accent:#8cc3de;--accent-fg:#0c1a23;--accent-soft:#183644;--steel:#79b3d1;--navy:#0b3a52;--cta:#ff4d43;--cta-fg:#16080a;--ok:#73cf9f;--warn:#f39a6c;
 --s1:#79b3d1;--s2:#9cc7ea;--s3:#ff7a6b;--s4:#6cc4b6;color-scheme:dark}
body{overflow-x:clip}
h1,h2,h3,h4{font-weight:500;letter-spacing:0}
h2{font-size:clamp(1.7rem,3vw,2.3rem);color:var(--accent)}
.kick{font-family:var(--f-serif);font-weight:400;font-size:.8rem;letter-spacing:.06em;color:var(--steel)}
main{max-width:none;padding:0}
.scr{gap:0}
.scr.boxed{max-width:1180px;margin:0 auto;width:100%;gap:1.1rem;padding-block:1.6rem 3rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{padding-block:3.2rem}
.band .in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:1rem}
.band .in.narrow{max-width:900px}
.band.soft{background:var(--panel2)}
.band.slim{padding-block:2.2rem}
.ctr{justify-content:center;text-align:center}
.eyebrow{font:400 .85rem var(--f-serif);letter-spacing:.12em;text-transform:uppercase;margin:0;color:inherit;opacity:.85}

/* header */
.bar2{background:var(--bg);backdrop-filter:none;border-bottom:1px solid var(--line)}
.bar2 > .in{justify-content:space-between;padding-block:.55rem}
.brand2{display:flex;align-items:center;gap:.6rem;color:var(--accent)}
.brand2 .bt{display:flex;flex-direction:column;line-height:1.05}
.brand2 b{font:600 1.15rem var(--f-serif);letter-spacing:.06em;text-transform:uppercase;display:block}
.brand2 small{font:400 .78rem var(--f-serif);letter-spacing:.05em}
.topnav{display:flex;align-items:center}
.topnav > button,.topnav .menu2 > button{all:unset;cursor:pointer;font:400 .95rem var(--f-serif);color:var(--accent);padding:.25rem .85rem;border-left:1px solid var(--line);white-space:nowrap}
.topnav > button:first-child{border-left:0}
.topnav > button.on{color:var(--cta)}
.topnav button:focus-visible{outline:3px solid var(--accent)}
@media (max-width:640px){.brand2 small{display:none}.topnav > button,.topnav .menu2 > button{padding:.25rem .5rem;font-size:.86rem}.topnav > button[data-go="home"]{display:none}.topnav > button[data-go="steps"]{border-left:0}}
@media (max-width:400px){.brand2 .bt{display:none}}
.subbar{background:var(--panel2);border-top:1px solid var(--line)}
.subbar .in{max-width:1180px;margin:0 auto;padding-block:.35rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stg{border-radius:4px}
.stg button{border-radius:3px;font-family:var(--f-serif)}
.prog i{background:var(--cta)}

/* buttons */
.btn{border-radius:2px;font:400 .95rem var(--f-serif);letter-spacing:.04em;text-transform:uppercase;padding:.55rem 1.1rem}
.btn.sm{font-size:.8rem;padding:.3rem .7rem}
.btn.cta,a.btn.cta{background:var(--cta);border-color:var(--cta);color:var(--cta-fg)}
.btn.cta:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid rgb(255 255 255 / .85);color:#fff}
.btn.ghost2,a.btn.ghost2{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn.pri,a.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.pager .btn{text-transform:none;font-family:var(--f-sans);letter-spacing:0;border-radius:2px}
.pager .nx.pri{background:var(--cta);border-color:var(--cta);color:var(--cta-fg)}

/* hero */
.hero3{background-size:cover;background-position:center;color:#fff;padding-block:clamp(4rem,11vw,8rem)}
.hero3 .in{align-items:center;text-align:center}
.hero3 h1{font-size:clamp(2.4rem,6.4vw,4.4rem);color:#fff;font-weight:500;line-height:1.05}
.hero3 .lead{color:#e9f1f6;font-size:1.15rem;max-width:46ch;margin:0}
.hero3 .row{gap:.7rem;margin-top:.4rem}

/* split with tiles */
.split3 .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.95fr);gap:0;padding-inline:0;max-width:none}
.split3{padding-block:0;background:var(--panel2)}
.split3 .txt{padding:3rem max(16px,env(safe-area-inset-left,0px)) 3rem max(16px,calc((100vw - 1180px)/2 + 16px));display:flex;flex-direction:column;gap:.8rem;align-items:flex-start;justify-content:center}
.tiles{display:grid}
.tile{all:unset;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:.15rem;padding:1.8rem 2.4rem;color:#fff;min-height:7.5rem;transition:padding-left .25s cubic-bezier(.16,1,.3,1)}
.tile:hover{padding-left:2.9rem}
.tile:focus-visible{outline:3px solid #fff;outline-offset:-6px}
.tile .no{font:300 1.6rem var(--f-serif);opacity:.9}
.tile .tt{font:500 1.6rem var(--f-serif);text-transform:uppercase;letter-spacing:.02em}
.tile .ts{font-size:.92rem;opacity:.9}
.tile.t1{background:#5092b3}.tile.t2{background:#0f4d6b}.tile.t3{background:#d40004}
@media (max-width:860px){.split3 .in{grid-template-columns:minmax(0,1fr)}.split3 .txt{padding:2.4rem max(16px,env(safe-area-inset-left,0px))}}

/* stats band */
.stats3 .in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;text-align:center}
.stats3 .in > div{border-left:1px solid var(--line);padding:.4rem .5rem}
.stats3 .in > div:first-child{border-left:0}
.stats3 .sl{font:400 1.05rem var(--f-serif);color:var(--accent);margin:0 auto}
.stats3 .sn{font:500 clamp(2.6rem,7vw,5.4rem)/1.05 var(--f-serif);color:var(--steel);margin:0 auto}
@media (max-width:700px){.stats3 .in{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:1.4rem}.stats3 .in > div:nth-child(3){border-left:0}}

/* step rows */
.rows{border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:7rem minmax(0,1fr) auto;gap:1rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--line)}
.srow .sd{display:flex;flex-direction:column;font-family:var(--f-serif)}
.srow .sd b{font-weight:500;font-size:1.05rem}.srow .sd span{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.srow .sm b{display:block;font:500 1.12rem var(--f-serif);color:var(--accent)}.srow .sm span{font-size:.92rem;color:var(--muted)}
@media (max-width:560px){.srow{grid-template-columns:minmax(0,1fr) auto}.srow .sd{grid-column:1/-1;flex-direction:row;gap:.6rem}}

/* navy band */
.navy3{background:var(--navy);color:#eef4f8}
.navy3 h1,.navy3 h2{color:#fff}

var STEPS=[
{n:1,id:"s1",title:"Ask a question and name the claim",short:"Write the sentence you want to defend at the end. Its type tells you what, if anything, to measure.",
learn:`<p>Before choosing a method, write down what you want to be able to say. Most claims in a qualitative project that need numbers belong to one of five types.</p>
<div class="tw"><table class="t claimtab"><thead><tr><th>Claim type</th><th>Template sentence</th><th>What the numbers show</th></tr></thead><tbody>
<tr><td>Descriptive</td><td>"The most common way commenters frame X is Y."</td><td>Shares per category</td></tr>
<tr><td>Comparative</td><td>"Framing Y is more common in A than in B."</td><td>A table of groups by categories</td></tr>
<tr><td>Relational</td><td>"When X appears, Y tends to appear too."</td><td>How often two codes occur together</td></tr>
<tr><td>Change over time</td><td>"Y rose after event E."</td><td>Shares per month or year</td></tr>
<tr><td>Absence</td><td>"Despite expectations, Z almost never appears."</td><td>Near-zero shares, plus proof that Z could have appeared</td></tr>
</tbody></table></div>
<p class="note" style="margin-top:.6rem">Questions of why and how stay qualitative. The numbers tell you how much, where and when, and which cases to read next.</p>
<div class="flag"><b>Pitfall.</b> "I have 10,000 comments; what can I measure?" lets the data choose the question. Start from the claim.</div>`,
tool:"claim",own:"tut-claim.mp4",ownT:"Write your claim (made for this guide)",ext:[],read:["creswell","bryman06","fetters","mason"],
check:[{q:"\"Women preachers cite scripture less often than men on the same websites.\" What type of claim is this?",o:["Descriptive","Comparative","Change over time"],a:1,f:"It compares two groups. Nielsen (2020) supports a claim of this kind with a large text corpus."},
{q:"Which question should stay qualitative?",o:["How often do viewers mention prayer?","Why does a prayer mat in a house tour matter to viewers?","Did mentions of prayer rise after Ramadan?"],a:1,f:"Meaning and motive are interpretive. The other two ask how much and when."},
{q:"An absence claim needs one thing beyond a near-zero share. What?",o:["A larger corpus","Evidence that the thing could have appeared and been caught","A statistical test"],a:1,f:"Check that your sample, your codebook and the platform did not hide it."}]},

{n:2,id:"s2",title:"Decide whether you need numbers",short:"Add a quantitative strand only if it answers a question you actually have.",
learn:`<p>A quantitative strand is warranted when at least one of these is true:</p>
<ul class="clean"><li>Your claim says <i>how often</i>, <i>more than</i>, <i>increasing</i> or <i>never</i>.</li>
<li>You have more material than you can read closely, and you need to know what the unread part contains.</li>
<li>You want to choose cases for close reading in a way others can follow and check.</li></ul>
<p style="margin-top:.6rem">If your question is about the lived meaning of one ritual, one conversation or one life, numbers may add nothing. Saying so is a legitimate decision, and examiners respect it more than numbers added for show.</p>
<div class="flag"><b>Pitfall.</b> "Numbers make it more scientific" is not a reason. Bryman (2006) found that many studies that combined methods never brought the two together. Know what yours will add.</div>`,
tool:"warrant",own:null,ext:[],read:["bryman06","bryman07","mason","pedersen"],
check:[{q:"You are studying how one family narrates a pilgrimage across three interviews. Do you need a quantitative strand?",o:["Yes, always","Probably not; the question is about meaning in a small set","Yes, to look rigorous"],a:1,f:"A quantitative strand should answer a question, not decorate one."},
{q:"Which is a good reason to add numbers?",o:["Reviewers like charts","You have 6,000 comments and can read only 400","Software is free"],a:1,f:"Numbers tell you what the unread material contains and help you choose what to read."},
{q:"According to Bryman (2006), a common problem in mixed-methods studies is:",o:["Too much integration","The two strands reported side by side without being brought together","Using surveys"],a:1,f:"Step 9 is about avoiding exactly this."}]},

{n:3,id:"s3",title:"Define the field, the corpus and the sample",short:"Write your field boundaries as rules someone else could follow.",
learn:`<p>Ethnographers already define a field. Here you write that definition down: which platforms or archives, which accounts, dates, languages and keywords, what unit you analyse (a comment, a sermon, an article), and what you left out.</p>
<div class="grid g2"><div class="card soft"><h4>Sampling in practice</h4><ul class="clean"><li>Sample within themes you found by watching or reading (stratified sampling), so you do not pick only the famous cases.</li><li>Keep a log: query, date collected, number returned, what the tool did not return.</li><li>Comments get deleted. A later download will not match yours. Record the date.</li></ul></div>
<div class="card soft"><h4>Who your data speaks for</h4><p>Platform data covers people who post on that platform, not a population. Users also hide from visibility through screenshots and coded language (Tufekci 2014). Lynch, Freelon and Aday (2014) found Arabic and English Twitter about Syria formed separate clusters, so a one-language sample sees one world.</p></div></div>
<div class="flag" style="margin-top:.6rem"><b>Pitfall.</b> Treating platform users as "the public" or "Egyptians." Write a boundary statement and keep your claims inside it.</div>`,
tool:"sample",own:null,ext:["apikey","ytdt","ab","wvs"],read:["tufekci","lynch","freelon15","pink","hine","boellstorff"],
check:[{q:"You collected comments by searching an Arabic hashtag. Your sample represents:",o:["Arab public opinion","People who used that hashtag on that platform in that period","All users of the platform"],a:1,f:"Keyword samples represent keyword users."},
{q:"Why record the collection date?",o:["For citation style","Comments are deleted and edited, so later downloads differ","APIs require it"],a:1,f:"Your log lets others see what you had and when."},
{q:"The YouTube Data API default daily allowance (November 2026) is:",o:["100 units","10,000 units","Unlimited"],a:1,f:"Reading one page of comment threads costs 1 unit. Search has a separate limit of 100 calls a day."}]},

{n:4,id:"s4",title:"Read first and build a codebook",short:"Read a manageable subset closely, then turn what recurs into defined categories.",
learn:`<p>Read a subset as you would field notes. Write memos. Group recurring responses into categories. Then write a codebook entry for each category:</p>
<ul class="clean"><li><b>Name</b> and a one-sentence <b>definition</b></li><li><b>Include</b> when… and <b>exclude</b> when…</li><li>A <b>typical example</b> and a <b>borderline example</b></li></ul>
<p style="margin-top:.6rem">Several categories can capture different sides of the same social act. Decide whether one text can carry several codes (usually yes for comments) and say so in the codebook.</p>
<div class="okbox"><b>From the family-vlogging study.</b> Watching five channels and reading comments produced seven categories: authenticity, parasocial relationships, emotion, moral domains, privacy, class, and temporal reflexivity. Each was piloted by hand before any machine work.</div>
<div class="flag" style="margin-top:.6rem"><b>Pitfall.</b> Too many overlapping categories. Agreement will be low later. Merge, or keep a category qualitative.</div>`,
tool:"codebook",own:"tut-codebook.mp4",ownT:"Build a codebook (made for this guide)",ext:["taguette","qualcoder","taguetteNYU","qualcoderFull"],read:["saldana","bwr","bernard","nelson20"],
check:[{q:"Which is missing from this entry? Name: Blessing. Definition: invokes God's favour on the family. Example: 'May God protect them.'",o:["A colour","Include and exclude rules, and a borderline example","A frequency"],a:1,f:"Rules and borderline cases are what make a category usable by someone else."},
{q:"Where should categories come from in a qualitative-first design?",o:["A list from a software package","Close reading of the material","The most frequent words"],a:1,f:"In the exploratory sequential design, reading builds the instrument."},
{q:"Can one comment carry more than one code?",o:["Never","Yes, if the codebook says so","Only in surveys"],a:1,f:"Most comments do several things at once. State the rule."}]},

{n:5,id:"s5",title:"Pilot the codebook and check agreement",short:"Two coders, or you on two days, code the same sample. Disagreements show where a category is unstable.",
learn:`<p>Take a random sample (100 to 200 units is common). Two people code it separately, or you code it twice a week apart. Compare, discuss disagreements, sharpen definitions, and repeat.</p>
<div class="grid g3"><div class="stat"><b>% agreement</b><span>Share of units where both coders chose the same code. Easy to read, but ignores chance.</span></div>
<div class="stat"><b>Cohen's κ</b><span>Agreement corrected for chance, for two coders.</span></div>
<div class="stat"><b>Krippendorff's α</b><span>Chance-corrected; works for any number of coders. Common guideline: α ≥ 0.800 for firm conclusions, ≥ 0.667 for tentative ones.</span></div></div>
<p style="margin-top:.6rem">O'Connor and Joffe (2020) argue that agreement checks make qualitative coding more systematic and transparent, and that the discussion of disagreements is itself reflexive work.</p>
<div class="flag"><b>Pitfall.</b> If agreement on a category stays low after two rounds, it may be too interpretive to scale. Keep it qualitative and say so.</div>`,
tool:"agree",own:"tut-agree.mp4",ownT:"Check agreement (made for this guide)",ext:["kappaXL","kappa","alpha","recal"],read:["oconnor","kripp"],
check:[{q:"Two coders agree on 90% of units, but one category covers 88% of units. What should you check?",o:["Nothing; 90% is high","A chance-corrected statistic, because agreement may be mostly chance","The font"],a:1,f:"When one category dominates, percent agreement is inflated. Look at κ or α."},
{q:"Krippendorff's commonly cited guideline for tentative conclusions is:",o:["α ≥ 0.400","α ≥ 0.667","α ≥ 0.950"],a:1,f:"And α ≥ 0.800 for firm conclusions."},
{q:"Agreement on 'irony' stays at κ = 0.35 after two rounds. A reasonable decision:",o:["Hide the number","Keep irony as a qualitative theme and report why","Drop all categories"],a:1,f:"Low agreement is a finding about the category."}]},

{n:6,id:"s6",title:"Scale up the coding and validate it",short:"Apply the codebook to everything, by hand, by rules, or with a model. Then compare with human coding, category by category.",
learn:`<div class="grid g4"><div class="card soft"><h4>1. By hand</h4><p class="note">Feasible up to a few thousand short texts. Slow but transparent.</p></div>
<div class="card soft"><h4>2. Keyword rules</h4><p class="note">Transparent and cheap. Weak with irony, dialect and spelling variation.</p></div>
<div class="card soft"><h4>3. Trained classifier</h4><p class="note">Learns from your hand-coded examples. Needs hundreds of them.</p></div>
<div class="card soft"><h4>4. Language model</h4><p class="note">Give it your codebook as instructions. Fast, but results change with model and prompt.</p></div></div>
<p style="margin-top:.6rem">Whatever you choose, keep a hand-coded validation set the machine never saw. Compare per category, because an overall score hides weak categories. The evidence on language models is mixed: Gilardi et al. (2023) found ChatGPT more accurate than crowd workers on English tasks; Ziems et al. (2024) found only fair agreement with humans on many classification tasks; Than et al. (2025) found models came close to supervised methods. None tested Egyptian or Levantine dialect comments.</p>
<div class="flag"><b>Arabic.</b> Dialect, Arabizi (Arabic in Latin letters and numbers) and spelling variation lower accuracy (Darwish 2014; Darwish et al. 2021). Test on a sample of each script and dialect. Record the model name, date, prompt and settings. Do not send identifiable personal data to a commercial service without checking ethics rules (Step 10).</div>`,
tool:"validate",own:"tut-validate.mp4",ownT:"Validate machine labels (made for this guide)",ext:["voyant","antconc","orange","camel","voyantFull"],read:["grimmer","nelson21","than","gilardi","ziems","tornberg","dimaggio","camel","darwish14","darwish21"],
check:[{q:"The model's overall accuracy is 86%. Is that enough?",o:["Yes","Not until you see per-category results","Only if it is GPT"],a:1,f:"A model can be accurate overall and fail on your most interpretive category."},
{q:"What should the validation set be?",o:["Examples the model was shown in the prompt","Hand-coded units the model never saw","The whole corpus"],a:1,f:"Otherwise you test memory, not performance."},
{q:"Why record the model name, date and prompt?",o:["Copyright","Outputs change with model versions and wording","To cite the company"],a:1,f:"Without this, nobody can repeat your coding."}]},

{n:7,id:"s7",title:"Describe and visualise",short:"Shares, tables of groups by categories, and change over time. Always show n.",
learn:`<p>You rarely need advanced statistics. The most useful outputs are:</p>
<ul class="clean"><li>Shares per category (with the number of units, n)</li><li>A table of groups by categories, such as channel by code or month by code</li><li>How often two codes occur together</li><li>A line of shares over time</li></ul>
<p style="margin-top:.6rem">A spreadsheet pivot table does all of this. Python or R are optional.</p>
<div class="grid g3"><div class="flag"><b>Frequency is not importance.</b> A rare comment can matter more than a common one.</div><div class="flag"><b>Ecological fallacy.</b> Patterns across channels or countries do not tell you what individuals think (Robinson 1950).</div><div class="flag"><b>Heavy users.</b> A few people can post many comments. Check unique authors too.</div></div>`,
tool:"xtab",own:"tut-xtab.mp4",ownT:"Make a table and choose what to read (made for this guide)",ext:["pivot","taguetteXL","ab","abAr","pandas"],read:["kripp","grimmer","robinson","arabbar"],
check:[{q:"Group A: 12 of 20 comments are critical (60%). Group B: 300 of 1,000 (30%). What should you add when you report this?",o:["Nothing","The n for each group, and a caution about the small group","A p-value only"],a:1,f:"Small groups make shares unstable."},
{q:"Country X shows more support for a policy than country Y. You can conclude:",o:["Every person in X supports it more","Support is higher on average in X's sample; individual attitudes vary","Y is against it"],a:1,f:"Keep claims at the level of your data."},
{q:"Ten accounts wrote 40% of all comments. What should you do?",o:["Ignore it","Report shares by unique author as well as by comment","Delete those accounts"],a:1,f:"Otherwise a few voices look like a crowd."}]},

{n:8,id:"s8",title:"Read again where the numbers point",short:"Use the results to choose what to read closely: the frequent, the rare, the surprising, and the absent.",
learn:`<p>This is the step that makes the design mixed. Use the results to choose:</p>
<ul class="clean"><li>The most frequent category, to understand why it dominates</li><li>Rare categories, which may carry marginal voices</li><li>Cells far above or below what you would expect</li><li>Surprising combinations of codes</li><li>Absences</li><li>Units where the machine and the human disagreed</li></ul>
<div class="okbox" style="margin-top:.6rem"><b>Example.</b> In the family-vlogging corpus, moral language was most frequent on one channel (about half its comments). Reading behind the figure showed much of it was ritual formula: one blessing on the Prophet appeared 33 times word for word. A high share of moral language did not mean a high share of moral judgment.</div>
<div class="card soft" style="margin-top:.6rem"><h4>Reading an absence</h4><p>An absence means something only if the thing could have appeared. Check that (a) your sample did not exclude it, (b) your codebook or keywords would have caught it, in dialect and Arabizi too, and (c) people were not avoiding the platform's visibility. On moderated or watched platforms, silence may mean removal or self-censorship.</p></div>`,
tool:"readnext",own:null,ext:[],read:["munk","nelson20","latour","venturini","jemielniak","gorska"],
check:[{q:"A cell has far more comments than expected. What next?",o:["Report it and move on","Read a sample of those comments to see what they are doing","Delete it as an outlier"],a:1,f:"The number tells you where to read, not what it means."},
{q:"Munk, Olesen and Jacomy (2022) found that a model predicted reactions easily when:",o:["Situations were ambiguous","Situations were unambiguous and interpretation was easy","Comments were long"],a:1,f:"So the cases a model gets wrong are where thick description is needed."},
{q:"No comment mentions child privacy. Before calling this a silence, check:",o:["Only the total number of comments","That such comments could have appeared and been coded","The video length"],a:1,f:"Sample, codebook and platform all have to allow the thing to show up."}]},

{n:9,id:"s9",title:"Integrate and write up",short:"Put both strands side by side in a joint display and say what the combination shows.",
learn:`<p>A <b>joint display</b> is a table with one row per category. Columns hold the share (n), agreement, typical and borderline quotations, what close reading showed, and your conclusion with its confidence. Fetters, Curry and Creswell (2013) describe integration at the reporting level as happening "through narrative, data transformation, and joint display."</p>
<p>Disagreement between the strands is a finding, not a mistake.</p>
<div class="card soft"><h4>Match your wording to your evidence</h4><ul class="clean"><li><b>"In this corpus…"</b> when the claim rests on your sample</li><li><b>"Among commenters on these channels…"</b> when it rests on platform data</li><li><b>"This suggests…"</b> when you reach beyond the data, followed by a sentence on limits</li></ul></div>`,
tool:"joint",own:"tut-joint.mp4",ownT:"Build a joint display (made for this guide)",ext:[],read:["fetters","guetterman","bryman07"],
check:[{q:"The numbers say criticism is rare; your fieldwork says people criticise a lot in private. This is:",o:["An error to hide","A finding: public and private registers differ","Proof the numbers are wrong"],a:1,f:"Divergence between strands is often the most interesting result."},
{q:"Which sentence fits a claim based on 2,000 comments from five channels?",o:["\"Egyptians believe…\"","\"Among commenters on these channels…\"","\"Everyone online…\""],a:1,f:"Keep the claim inside the boundary you wrote in Step 3."},
{q:"What makes a joint display more than two tables?",o:["Colour","A column that states what the combination shows","More rows"],a:1,f:"The conclusion column is where integration happens."}]},

{n:10,id:"s10",title:"Ethics, data care and transparency",short:"Public is not the same as ethical. Protect people, store data safely, and keep a record others can follow.",
learn:`<p>Consider how identifiable people are, how vulnerable, and what they would expect. In the Middle East and North Africa, speech about religion, gender, sexuality or politics can carry legal and social risk. Treat dissent, minority religious voices and gender-nonconforming speech as high-risk by default.</p>
<ul class="clean"><li>Do not quote searchable comments word for word if that could identify someone at risk. Paraphrase or translate.</li><li>Use pseudonyms for ordinary users and for minors.</li><li>Uploading comments to a commercial model is a data transfer. Check your institution's rules, and data-protection law such as the GDPR where it applies.</li><li>Platform terms may forbid sharing raw data.</li></ul>
<div class="card soft" style="margin-top:.6rem"><h4>Your reproducibility file</h4><p>Sampling log · codebook versions · agreement results · model, prompt and date · validation results · spreadsheets or scripts · a note on what you left out.</p></div>`,
tool:"ethics",own:null,ext:[],read:["aoir","markham","ess","tufekci","siegel20"],
check:[{q:"A comment is public. Can you quote it word for word with the username?",o:["Always","It depends on risk and expectations; often paraphrase and pseudonymise","Never quote anything"],a:1,f:"AoIR guidance asks you to weigh harm, not just access."},
{q:"Which is a data transfer that may need approval?",o:["Reading comments on YouTube","Sending comments to a commercial language model","Counting words in a spreadsheet on your laptop"],a:1,f:"Check your institution's rules first."},
{q:"What goes in a reproducibility file?",o:["Only the final chart","Sampling log, codebook versions, agreement, prompts, scripts","Your notes on reviewers"],a:1,f:"Enough for someone else to follow every decision."}]}
];

"annotate.py":"\"\"\"Annotate comments with an open model through any OpenAI-compatible API.\"\"\"\nimport csv, json, os, re, sys, time\nfrom openai import OpenAI\n\nPROVIDERS = {\n    \"local\":      (\"http://localhost:11434/v1\", \"ollama\",              \"qwen3:1.7b\"),\n    \"groq\":       (\"https://api.groq.com/openai/v1\", \"GROQ_API_KEY\",   \"llama-3.3-70b-versatile\"),\n    \"google\":     (\"https://generativelanguage.googleapis.com/v1beta/openai/\", \"GEMINI_API_KEY\", \"gemma-3-27b-it\"),\n    \"openrouter\": (\"https://openrouter.ai/api/v1\", \"OPENROUTER_API_KEY\", \"google/gemma-4-31b-it:free\"),\n}\nname = os.environ.get(\"PROVIDER\", \"local\")\nbase_url, key, model = PROVIDERS[name]\nbase_url = os.environ.get(\"BASE_URL\", base_url)\nmodel = os.environ.get(\"MODEL\", model)\napi_key = os.environ.get(key, key)          # local servers accept any key\nclient = OpenAI(base_url=base_url, api_key=api_key)\n\nCODEBOOK = open(os.environ.get(\"CODEBOOK\", \"codebook.txt\"), encoding=\"utf-8\").read()\n\ndef code_one(text):\n    for attempt in range(3):\n        try:\n            r = client.chat.completions.create(\n                model=model, temperature=0, max_tokens=120,\n                # \"/no_think\" switches off Qwen3's thinking step; other models ignore it\n                messages=[{\"role\": \"system\", \"content\": CODEBOOK},\n                          {\"role\": \"user\", \"content\": \"Comment: \" + text + \" /no_think\"}])\n            text_out = r.choices[0].message.content or \"\"\n            text_out = re.sub(r\"<think>.*?</think>\", \"\", text_out, flags=re.S)  # drop reasoning\n            out = json.loads(re.search(r\"\\{.*\\}\", text_out, re.S).group(0))\n            return out.get(\"code\", \"\").strip().upper(), out.get(\"reason\", \"\")\n        except Exception as e:  # rate limit or bad JSON: retry\n            time.sleep(2 * (attempt + 1))\n    return \"ERROR\", \"\"\n\nrows = list(csv.DictReader(open(sys.argv[1], encoding=\"utf-8\")))\nwith open(\"model_codes.csv\", \"w\", newline=\"\", encoding=\"utf-8\") as f:\n    w = csv.writer(f); w.writerow([\"id\", \"lang\", \"model\", \"reason\"])\n    for row in rows:\n        code, why = code_one(row[\"text\"])\n        w.writerow([row[\"id\"], row[\"lang\"], code, why])\n        print(f'{row[\"id\"]:>3} {row[\"lang\"]}  {code:<10} {why}', flush=True)\nprint(f\"\\nDone: {len(rows)} comments coded with {model} via {name}.\")\n",
"check.py":"\"\"\"Compare model codes with hand codes, per category and per language.\"\"\"\nimport pandas as pd\nfrom sklearn.metrics import cohen_kappa_score, classification_report\n\nm = pd.read_csv(\"model_codes.csv\"); h = pd.read_csv(\"hand_codes.csv\")\nd = m.merge(h, on=\"id\")\nprint(f\"Agreement: {(d.model == d.human).mean():.0%}   Cohen's kappa: {cohen_kappa_score(d.human, d.model):.2f}\\n\")\nprint(classification_report(d.human, d.model, zero_division=0, digits=2))\nprint(\"By language:\")\nprint(d.assign(ok=d.model == d.human).groupby(\"lang\").ok.mean().map(\"{:.0%}\".format).to_string(), \"\\n\")\nprint(\"Reread these:\")\nprint(d[d.model != d.human][[\"id\", \"lang\", \"human\", \"model\", \"reason\"]].to_string(index=False))\n",

Object.assign(REFS,{"johnson07": {"c": "Johnson, R. Burke, Anthony J. Onwuegbuzie, and Lisa A. Turner. 2007. \"Toward a Definition of Mixed Methods Research.\" <i>Journal of Mixed Methods Research</i> 1 (2): 112–133.", "u": "https://doi.org/10.1177/1558689806298224", "why": "Nineteen definitions of mixed methods, compared and reduced to one."}, "greene89": {"c": "Greene, Jennifer C., Valerie J. Caracelli, and Wendy F. Graham. 1989. \"Toward a Conceptual Framework for Mixed-Method Evaluation Designs.\" <i>Educational Evaluation and Policy Analysis</i> 11 (3): 255–274.", "u": "https://doi.org/10.3102/01623737011003255", "why": "Five reasons to mix methods: triangulation, complementarity, development, initiation, expansion."}, "small11": {"c": "Small, Mario Luis. 2011. \"How to Conduct a Mixed Methods Study: Recent Trends in a Rapidly Growing Literature.\" <i>Annual Review of Sociology</i> 37 (1): 57–86.", "u": "https://doi.org/10.1146/annurev.soc.012809.102657", "why": "A review of how sociologists combine data and analysis types."}, "lieberman05": {"c": "Lieberman, Evan S. 2005. \"Nested Analysis as a Mixed-Method Strategy for Comparative Research.\" <i>American Political Science Review</i> 99 (3): 435–452.", "u": "https://doi.org/10.1017/S0003055405051762", "why": "Nested analysis: use a large-n analysis to choose cases for close study, and the reverse."}, "seawright16": {"c": "Seawright, Jason. 2016. <i>Multi-Method Social Science: Combining Qualitative and Quantitative Tools</i>. Cambridge University Press.", "u": "https://doi.org/10.1017/CBO9781316160831", "why": "How qualitative and quantitative evidence can test each other's assumptions."}, "braun06": {"c": "Braun, Virginia, and Victoria Clarke. 2006. \"Using thematic analysis in psychology.\" <i>Qualitative Research in Psychology</i> 3 (2): 77–101.", "u": "https://doi.org/10.1191/1478088706qp063oa", "why": "The most cited guide to thematic analysis, step by step."}, "hayes07": {"c": "Hayes, Andrew F., and Klaus Krippendorff. 2007. \"Answering the Call for a Standard Reliability Measure for Coding Data.\" <i>Communication Methods and Measures</i> 1 (1): 77–89.", "u": "https://doi.org/10.1080/19312450709336664", "why": "Why Krippendorff's alpha suits most coding studies, with software."}, "lombard02": {"c": "Lombard, Matthew, Jennifer Snyder-Duch, and Cheryl Campanella Bracken. 2002. \"Content Analysis in Mass Communication: Assessment and Reporting of Intercoder Reliability.\" <i>Human Communication Research</i> 28 (4): 587–604.", "u": "https://doi.org/10.1111/j.1468-2958.2002.tb00826.x", "why": "What content-analysis studies should report about agreement."}, "landis77": {"c": "Landis, J. Richard, and Gary G. Koch. 1977. \"The Measurement of Observer Agreement for Categorical Data.\" <i>Biometrics</i> 33 (1): 159–74.", "u": "https://doi.org/10.2307/2529310", "why": "The source of the common kappa bands (slight, fair, moderate, substantial)."}, "grimmer13": {"c": "Grimmer, Justin, and Brandon M. Stewart. 2013. \"Text as Data: The Promise and Pitfalls of Automatic Content Analysis Methods for Political Texts.\" <i>Political Analysis</i> 21 (3): 267–297.", "u": "https://doi.org/10.1093/pan/mps028", "why": "Four principles: all models are wrong, none replaces reading, validate, validate."}, "roberts14": {"c": "Roberts, Margaret E., et al. 2014. \"Structural Topic Models for Open‐Ended Survey Responses.\" <i>American Journal of Political Science</i> 58 (4): 1064–1082.", "u": "https://doi.org/10.1111/ajps.12103", "why": "Topic models for open-ended survey answers."}, "evans16": {"c": "Evans, James A., and Pedro Aceves. 2016. \"Machine Translation: Mining Text for Social Theory.\" <i>Annual Review of Sociology</i> 42 (1): 21–50.", "u": "https://doi.org/10.1146/annurev-soc-081715-074206", "why": "How text mining can serve social theory, and where it misleads."}, "mohr13": {"c": "Mohr, John W., and Petko Bogdanov. 2013. \"Introduction—Topic models: What they are and why they matter.\" <i>Poetics</i> 41 (6): 545–569.", "u": "https://doi.org/10.1016/j.poetic.2013.10.001", "why": "What topic models are, for cultural sociologists and humanists."}, "bail14": {"c": "Bail, Christopher A. 2014. \"The cultural environment: measuring culture with big data.\" <i>Theory and Society</i> 43 (3-4): 465–482.", "u": "https://doi.org/10.1007/s11186-014-9216-5", "why": "Big data as a resource for the sociology of culture."}, "baden22": {"c": "Baden, Christian, Christian Pipal, Martijn Schoonvelde, and Mariken A. C. G van der Velden. 2022. \"Three Gaps in Computational Text Analysis Methods for Social Sciences: A Research Agenda.\" <i>Communication Methods and Measures</i> 16 (1): 1–18.", "u": "https://doi.org/10.1080/19312458.2021.2015574", "why": "Three gaps between text-analysis tools and social-science concepts."}, "blok14": {"c": "Blok, Anders, and Morten Axel Pedersen. 2014. \"Complementary social science? Quali-quantitative experiments in a Big Data world.\" <i>Big Data & Society</i> 1 (2).", "u": "https://doi.org/10.1177/2053951714543908", "why": "Quali-quantitative work: ethnographers and data scientists on the same project."}, "ford14": {"c": "Ford, Heather. 2014. \"Big Data and Small: Collaborations between ethnographers and data scientists.\" <i>Big Data & Society</i> 1 (2).", "u": "https://doi.org/10.1177/2053951714544337", "why": "What happens when ethnographers and data scientists collaborate."}, "breiger15": {"c": "Breiger, Ronald L. 2015. \"Scaling down.\" <i>Big Data & Society</i> 2 (2).", "u": "https://doi.org/10.1177/2053951715602497", "why": "Scaling down: the case for small, close analysis inside big data."}, "miller16": {"c": "Miller, Daniel, Elisabetta Costa, Nell Haynes, Tom McDonald, Razvan Nicolescu, Jolynna Sinanan, Juliano Spyer, Shriram Venkatraman, and Xinyuan Wang. 2016. <i>How the World Changed Social Media</i>. London: UCL Press. Open access.", "u": "https://doi.org/10.14324/111.9781910634493", "why": "Comparative ethnography of social media in nine field sites. Open access."}, "da19": {"c": "Da, Nan Z. 2019. \"The Computational Case against Computational Literary Studies.\" <i>Critical Inquiry</i> 45 (3): 601–639.", "u": "https://doi.org/10.1086/702594", "why": "A sharp critique of computational literary studies. Read it before you count."}, "guldi23": {"c": "Guldi, Jo. 2023. <i>The Dangerous Art of Text Mining: A Methodology for Digital History</i>. Cambridge University Press.", "u": "https://doi.org/10.1017/9781009263016", "why": "A historian's guide to text mining, with its dangers."}, "graham16": {"c": "Graham, Shawn, Ian Milligan, and Scott Weingart. 2015. <i>Exploring Big Historical Data: The Historian's Macroscope</i>. Imperial College Press.", "u": "https://doi.org/10.1142/p981", "why": "Big historical data for historians: tools and cautions."}, "licht23": {"c": "Licht, Hauke. 2023. \"Cross-Lingual Classification of Political Texts Using Multilingual Sentence Embeddings.\" <i>Political Analysis</i> 31 (3): 366–379.", "u": "https://doi.org/10.1017/pan.2022.29", "why": "Multilingual sentence embeddings classify political texts across languages."}, "maier22": {"c": "Maier, Daniel, Christian Baden, Daniela Stoltenberg, Maya De Vries-Kedem, and Annie Waldherr. 2022. \"Machine Translation Vs. Multilingual Dictionaries Assessing Two Strategies for the Topic Modeling of Multilingual Text Collections.\" <i>Communication Methods and Measures</i> 16 (1): 19–38.", "u": "https://doi.org/10.1080/19312458.2021.1955845", "why": "Compares machine translation with multilingual dictionaries for topic models across languages."}, "devries18": {"c": "de Vries, Erik, Martijn Schoonvelde, and Gijs Schumacher. 2018. \"No Longer Lost in Translation: Evidence that Google Translate Works for Comparative Bag-of-Words Text Applications.\" <i>Political Analysis</i> 26 (4): 417–430.", "u": "https://doi.org/10.1017/pan.2018.26", "why": "Machine translation is good enough for bag-of-words text analysis."}, "abdulmageed21": {"c": "Abdul-Mageed, Muhammad, AbdelRahim Elmadany, and El Moatez Billah Nagoudi. 2021. \"ARBERT & MARBERT: Deep Bidirectional Transformers for Arabic.\" <i>Proceedings of the 59th Annual Meeting of the Association for Computational Linguistics and the 11th International Joint Conference on Natural Language Processing (Volume 1: Long Papers)</i>: 7088–7105.", "u": "https://doi.org/10.18653/v1/2021.acl-long.551", "why": "Arabic language models trained on dialects as well as standard Arabic."}, "rathje24": {"c": "Rathje, Steve, Dan-Mircea Mirea, Ilia Sucholutsky, Raja Marjieh, Claire E. Robertson, and Jay J. Van Bavel. 2024. \"GPT is an effective tool for multilingual psychological text analysis.\" <i>Proceedings of the National Academy of Sciences</i> 121 (34).", "u": "https://doi.org/10.1073/pnas.2308950121", "why": "GPT detected sentiment, emotions and moral foundations in 12 languages, far better than English dictionaries."}, "bail24": {"c": "Bail, Christopher A. 2024. \"Can Generative AI improve social science?\" <i>Proceedings of the National Academy of Sciences</i> 121 (21).", "u": "https://doi.org/10.1073/pnas.2314021121", "why": "What generative AI can and cannot do for social science."}, "spirling23": {"c": "Spirling, Arthur. 2023. \"Why open-source generative AI models are an ethical way forward for science.\" <i>Nature</i> 616 (7957): 413–413.", "u": "https://doi.org/10.1038/d41586-023-01295-4", "why": "Open models let others rerun and inspect your analysis; closed models can change or vanish."}, "palmer24": {"c": "Palmer, Alexis, Noah A. Smith, and Arthur Spirling. 2023. \"Using proprietary language models in academic research requires explicit justification.\" <i>Nature Computational Science</i> 4 (1): 2–3.", "u": "https://doi.org/10.1038/s43588-023-00585-1", "why": "Using a closed commercial model needs an explicit justification."}, "zimmer10": {"c": "Zimmer, Michael. 2010. \"“But the data is already public”: on the ethics of research in Facebook.\" <i>Ethics and Information Technology</i> 12 (4): 313–325.", "u": "https://doi.org/10.1007/s10676-010-9227-5", "why": "\"The data is already public\" is not an ethical argument."}, "fiesler18": {"c": "Fiesler, Casey, and Nicholas Proferes. 2018. \"“Participant” Perceptions of Twitter Research Ethics.\" <i>Social Media + Society</i> 4 (1).", "u": "https://doi.org/10.1177/2056305118763366", "why": "A survey of Twitter users on how they feel about researchers using their posts."}});

var TRANS={"tut-agree.mp4": ["Step 5 checks whether your codebook can be applied consistently. Two people code the same sample, or you code it twice, a week apart.", "Paste the two columns from a spreadsheet. Here I load invented practice data: twenty comments, coded by two coders.", "The calculator reports three numbers. Simple agreement is eighty percent. Cohen's kappa and Krippendorff's alpha correct for agreement by chance. Both are about point seven three.", "A common guideline is an alpha of at least point eight for firm conclusions, and point six six seven for tentative ones. So this codebook supports tentative conclusions for now.", "The table shows who chose what. Numbers off the diagonal are disagreements.", "Advice and criticism were confused twice. That boundary needs a sharper rule. Revise the codebook, code a fresh sample, and check again."], "tut-claim.mp4": ["This is the claim builder in Step 1. It helps you write the sentence your project will defend, before you choose any method.", "First, describe your topic in a few words. Here: how viewers respond to family vloggers' pregnancies.", "Next, choose the type of claim. This one compares two groups, so I choose Comparative.", "Now fill in the template: the pattern, and the two groups you want to compare.", "The builder writes the claim, and tells you what you will need to show: a table of groups by categories, with the size of each group.", "Then write the why or how question that stays qualitative. The numbers will tell you where to look. Your reading will tell you what it means.", "Copy the result into your notes. Everything you type is also collected on the Your plan page, under Toolkit."], "tut-codebook.mp4": ["In Step 4 you turn what you noticed while reading into a codebook. Each row is one category.", "To see the format, load the example rows. They are invented. Each has a name, a definition, rules for including and excluding, and two examples.", "Now add your own category. Write the definition in one sentence, then say when to include it and when to exclude it.", "The checker below flags categories that lack rules or a borderline example. Borderline cases are what make a category usable by someone else.", "Decide whether one comment can carry several codes. For comments, it usually can.", "Copy the codebook as a table and paste it into a spreadsheet. Steps 6 and 9 reuse it automatically."], "tut-validate.mp4": ["In Step 6 you apply the codebook to everything, and then test how well that worked.", "First, say how much material you have and how interpretive your categories are. For thousands of comments with interpretive categories, the tool suggests a language model or classifier, with a strong validation set.", "If you use a language model, this box turns your codebook into instructions. Record the model name, the date and the settings, because results change between versions.", "Then compare the machine's codes with your own coding of units the machine never saw. Here is invented practice data.", "Look at each category, not only the overall score. Precision asks how often the machine was right when it used a code. Recall asks how many of your codes it found.", "Irony is weak: the machine found only one of four. Read those disagreements. Sharpen the rules, or keep irony as a qualitative theme, and say so."], "tut-xtab.mp4": ["Step 7 turns coded units into a simple table. You need two columns: a group, such as a channel or a month, and a category.", "Here is invented practice data for three channels.", "Each row shows the share of a channel's comments in each category, with the number of comments in brackets. Always report that number.", "Channel C has fewer than thirty comments. Its shares can swing a lot, so treat them with care.", "Step 8 uses the same table to decide what to read next. It compares each cell with what you would expect if channels and categories were unrelated.", "Criticism on channel B and blessing on channel A are well above what you would expect. Read a sample of those comments first, and ask what they are doing.", "Before you call something absent, tick these three checks: your sample could have included it, your codebook could have caught it, and people were not hiding it."], "tut-joint.mp4": ["Step 9 brings the two strands together in a joint display. Each row is one category from your codebook.", "Enter the share with its number of units, and the agreement you found for this category in Step 5.", "Add a typical and a borderline quotation, and what close reading of those comments showed.", "The conclusion column is where integration happens. Say what the combination shows that neither strand shows alone.", "Finally, phrase the claim at the right scale. In this corpus, when the claim rests on your sample. This suggests, when you reach further, followed by a sentence on limits.", "Copy the table into your paper or slides."], "tut-sample.mp4": ["Step 3 asks you to draw the edges of your field before you collect, or as soon as you have. Go to the Try it slide.", "Fill in where the material comes from, and whose it is. Here, five Egyptian family channels on YouTube.", "Then the period, the languages, and the unit you will code: one top-level comment.", "Say how you selected, and which tool collected the data.", "The most important field is what you did not get. Replies and deleted comments are missing, so conversations are partial.", "The tool writes a boundary statement. Your claims refer to this material and these commenters, not to Egyptian viewers in general.", "Copy it into your methods section. It also goes into your plan."], "tut-ethics.mp4": ["Step 10 is a checklist for working with people's words. Public posts are not the same as consent. Go to the Try it slide.", "The first question asks whether a quotation could identify someone who could be harmed. Comments about children and religion can. I tick it, and the tool marks the material as high risk.", "Then tick each practice already in place: pseudonyms instead of usernames, paraphrase for searchable quotations, the platform's terms.", "If you send text to a commercial AI service, check your institution's rules first. Record the model, the prompts and the date.", "Keep a log of sampling, codebook versions and agreement results. That log is what makes the numbers checkable.", "The summary counts what is in place. It does not replace ethics review. Ask your institution's ethics office."], "tut-annotate.mp4": ["Here is the whole method in three files. First, the comments: twenty-four short comments, invented for practice, in Arabic, English, French, Turkish, Persian and Urdu.", "Second, the codebook. It is plain text: four codes, each with a short definition. You revise this file, not the code.", "Third, the script. It sends each comment, with the codebook, to a model. This block is the only part that changes between providers.", "Local means a model running on your own computer, through Ollama. The comments never leave your machine, and no key is needed.", "Groq, Google AI Studio and OpenRouter host open models for free, within daily limits. Each needs a key, which the script reads from an environment variable, never from the code.", "Temperature zero makes answers as repeatable as possible. Any reasoning the model prints is removed, and only the JSON answer is kept. If a call fails, it waits and tries again.", "Now run it. This recording uses Qwen3 with one point seven billion parameters, served by llama dot c p p, which speaks the same interface as Ollama, on a two-core processor.", "Each line shows the comment number, its language, the code, and the model's reason. Blessings come out right in every language. Almost everything else is labelled OTHER, often as a question, which it is not.", "Twenty-four comments took seventy seconds. Before trusting any of it, compare it with your own hand codes. That is the next clip."], "tut-check.mp4": ["The second script compares the model with you. First you hand-code a sample yourself. Here, all twenty-four comments.", "It reports raw agreement and Cohen's kappa, which corrects for agreement by chance.", "Then precision and recall for each code, agreement for each language, and a list of every disagreement to reread.", "For the small model: fifty percent agreement, kappa zero point three five. Blessings are perfect. Advice and criticism are never found.", "Is the codebook to blame? I added an example to each code, and ran the small model again.", "No better: kappa zero point three three. Now it calls most comments criticism. It seems to copy the example about filming fights.", "Next, a larger model: Qwen3 with four billion parameters, on the same machine, with the first codebook.", "Eighty-three percent, kappa zero point seven eight. Four comments to reread, spread across Arabic, French and Persian. Two of them are close calls that a second human coder might also dispute.", "With the second codebook the larger model also reached eighty-three percent, but it missed different comments, two of them in Turkish. Twenty-four comments cannot show which codebook is better. Hand-code a larger sample, and report results for each code and each language."], "tut-keys.mp4": ["Chapter 5 starts with a choice: where will the model run? There are four routes, and the same script works for all of them.", "Your own computer, through Ollama. No key and no daily limit, and the comments never leave your machine. It is slower, and it needs a few gigabytes of memory.", "Groq runs open models such as Llama on its own servers. The free tier allows about a thousand requests a day. You need a key from the Groq console.", "Google AI Studio serves Gemma models with a free key. Read the privacy note: outside Europe, free-tier prompts may be used by Google.", "OpenRouter lists free models from several hosts. Without credit you get fifty requests a day. The free list changes often.", "Each route shows two lines to run. The first stores your key in an environment variable. The second tells the script which route to use.", "The next slide has the same commands for Mac, Linux and Windows. Never paste a key into the script or into a shared notebook.", "Below are short videos by other teachers showing each sign-up page, step by step. Free limits change, so check them on the provider's site before a big run."], "tut-voyant.mp4": ["Voyant Tools is a free reader for texts that runs in the browser. Here I paste ten comments, in English translation, from the family vlogging study.", "Click Reveal. Voyant splits the text into words and opens several panels at once.", "The summary panel lists the most frequent words. The top word is way, with three uses.", "The contexts panel shows every use in its sentence. All three come from one comment: the clothes are too much, way way way too much.", "So the word cloud misleads. One emphatic comment makes way look like a theme. Always read behind a frequent word before you report it.", "Trends shows where words fall across the text. Use it to find the passages worth reading closely.", "Voyant also reads Arabic script. With dialect, check spelling variants before you trust a count."], "tut-recal.mp4": ["ReCal 2, by Deen Freelon, calculates agreement between two coders for free. It needs a spreadsheet saved as a CSV file: one column per coder, one row per unit, and a number for each code.", "Choose the file. This one holds invented practice data: twenty comments coded by two people, with codes one to four.", "Then click Calculate Reliability.", "ReCal reports percent agreement, Scott's pi, Cohen's kappa and Krippendorff's alpha. Here agreement is eighty percent, and kappa and alpha are about point seven three.", "These match the calculator in this guide. Report the chance-corrected figures, and read the disagreements before you change the codebook."]};

add("c1","What this guide is for",'<p class="lede">This guide shows how to add quantitative analysis to a qualitative project.</p><ul class="pts"><li>Your material can be interviews, fieldnotes, archives, sermons, novels, posts or comments.</li><li>You keep reading closely. The numbers tell you where to read, and they support claims about how often, how much, or how different.</li><li>No statistics background is assumed. The tools do the arithmetic.</li></ul>');

/* ---- chapter 2: the qualitative study ---- */
add("c2","What a qualitative study produces",'<ul class="pts"><li>Descriptions of practices and meanings in their setting.</li><li>Categories built from the material itself.</li><li>Cases, chosen and read in depth.</li><li>Accounts of how something works, from the inside.</li></ul><p class="src">Methods texts: '+cite("bernard")+' '+cite("saldana")+'</p>');
add("c2","Questions numbers can help with",'<div class="tw"><table class="tbl5"><thead><tr><th>Claim type</th><th>Example</th><th>What to measure</th></tr></thead><tbody>'+
 [["Descriptive","Most comments under prank videos praise the parents.","Share of comments with the code"],["Comparative","One channel draws more religious blessings than the others.","Shares side by side, with n"],["Relational","Videos about children draw more advice.","Share of a code across video types"],["Change over time","Criticism rises after a controversy.","Share by month"],["Absence","Commenters rarely mention the children's privacy.","How rare, and where it does appear"]].map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>';}).join("")+'</tbody></table></div><p class="note">If your claim uses words such as most, more, often, rarely or never, it can take a number.</p>');
add("c2","Questions numbers cannot answer",'<ul class="pts"><li>What a word, act or image means to the people involved.</li><li>Why one person acted as they did.</li><li>Anything about an individual from a pattern across a group. A group pattern does not tell you about its members. '+cite("robinson")+'</li><li>Whether a computer\'s categories are right. They have to be checked by reading. '+cite("grimmer13")+'</li></ul>');
add("c2","Where the numbers come from",'<p class="lede">Most numbers in a qualitative project are counts of coded units.</p><ul class="pts"><li>Choose the unit first: a comment, a sermon, a paragraph, an interview, a scene.</li><li>Code each unit for the presence or absence of each category.</li><li>Count units with the code, and divide by all units in the group.</li><li>Turning codes into counts loses context. Keep the quotes linked to every number. '+cite("sandelowski09")+'</li></ul>');
add("c2","Keep the qualitative core",'<ul class="pts"><li>Use numbers to answer sub-questions inside an interpretive project.</li><li>Report what reading found next to each number.</li><li>Let surprising numbers send you back to the material, not to a conclusion.</li></ul><p class="src">'+cite("mason")+' '+cite("small11")+'</p>');

 [["Connecting","One strand selects the sample for the other.","Read the channels with the highest share."],["Building","One strand builds the tool for the other.","Codes from reading become the codebook."],["Merging","Bring both strands together to compare.","A joint display of numbers and quotes."],["Embedding","Link the strands at several points.","Reread after each round of coding."]].map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>';}).join("")+'</tbody></table></div><p class="src">'+cite("fetters")+'</p>');
add("c3","Show the integration in a joint display",'<div class="tw"><table class="tbl5"><thead><tr><th>Code</th><th>Number</th><th>Example</th><th>What reading found</th><th>Conclusion</th></tr></thead><tbody><tr><td>Moral domains</td><td>50.2% of 4,036 comments</td><td>A blessing repeated word for word</td><td>Much of it is ritual formula</td><td>High count, low judgment</td></tr></tbody></table></div><ul class="pts"><li>One row per code or theme.</li><li>Build yours in step 9.</li></ul><p class="src">'+cite("guetterman")+'</p>');
